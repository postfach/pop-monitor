<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoP Monitor ROI picker</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#d8d8d2; --accent:#d4237a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --line:#33332f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button, label.btn { border:1px solid var(--line); background:transparent; color:var(--fg); padding:7px 12px;
    border-radius:8px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #wrap { position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; min-height:200px;
    display:flex; align-items:center; justify-content:center; color:var(--muted); }
  canvas { display:block; width:100%; height:auto; touch-action:none; }
  pre { background:transparent; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  @media (max-width:700px) { .row { grid-template-columns:1fr; } }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ROI picker</h1>
  <p>Load a snapshot from the camera (open <code>http://CAMERA/axis-cgi/jpg/image.cgi</code> and save it),
     then drag the four handles onto the screen's corners. Copy the result into the gateway config.</p>
  <div class="bar">
    <label class="btn">Load image<input id="file" type="file" accept="image/*" hidden></label>
    <button id="reset">Reset corners</button>
    <label><input id="inset" type="number" min="0" max="20" value="3" style="width:56px"> % inset</label>
    <button class="primary" id="copy">Copy config JSON</button>
    <small id="msg"></small>
  </div>
  <div id="wrap"><span id="hint">No image loaded</span><canvas id="c" hidden></canvas></div>
  <div class="row">
    <div><small>Gateway config (<code>roi</code>, <code>inset_pct</code>)</small><pre id="json"></pre></div>
    <div><small>ACAP parameter <code>RoiCorners</code></small><pre id="acap"></pre></div>
  </div>
</main>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let img = null, pts = [[0.2,0.2],[0.8,0.2],[0.8,0.8],[0.2,0.8]], drag = -1;
const names = ['TL','TR','BR','BL'];

function draw() {
  if (!img) return;
  ctx.drawImage(img, 0, 0);
  const W = c.width, H = c.height, inset = (+document.getElementById('inset').value || 0) / 100;
  ctx.lineWidth = Math.max(2, W / 600);
  ctx.strokeStyle = '#d4237a'; ctx.fillStyle = 'rgba(212,35,122,0.15)';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0]*W, p[1]*H) : ctx.moveTo(p[0]*W, p[1]*H));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // inset preview (bilinear approximation of the analysed area)
  const lerp = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  const at = (u, v) => lerp(lerp(pts[0], pts[1], u), lerp(pts[3], pts[2], u), v);
  ctx.setLineDash([6, 6]); ctx.beginPath();
  [[inset,inset],[1-inset,inset],[1-inset,1-inset],[inset,1-inset]].forEach((uv, i) => {
    const p = at(uv[0], uv[1]); i ? ctx.lineTo(p[0]*W, p[1]*H) : ctx.moveTo(p[0]*W, p[1]*H); });
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  const r = Math.max(8, W / 120);
  ctx.font = `${Math.round(r * 1.4)}px system-ui`;
  pts.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p[0]*W, p[1]*H, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d4237a'; ctx.fillText(names[i], p[0]*W + r * 1.3, p[1]*H - r);
  });
  out();
}
function out() {
  const r4 = v => Math.round(v * 10000) / 10000, inset = +document.getElementById('inset').value || 0;
  const roi = pts.map(p => [r4(p[0]), r4(p[1])]);
  document.getElementById('json').textContent =
    `"roi": ${JSON.stringify(roi)},\n"inset_pct": ${inset}`;
  document.getElementById('acap').textContent = roi.map(p => p.join(',')).join(' ');
}
function pos(e) {
  const b = c.getBoundingClientRect();
  return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
}
c.addEventListener('pointerdown', e => {
  const p = pos(e), b = c.getBoundingClientRect();
  let best = -1, bd = 1e9;
  pts.forEach((q, i) => { const d = Math.hypot((q[0]-p[0])*b.width, (q[1]-p[1])*b.height); if (d < bd) { bd = d; best = i; } });
  if (bd < 40) { drag = best; c.setPointerCapture(e.pointerId); }
});
c.addEventListener('pointermove', e => {
  if (drag < 0) return;
  const p = pos(e); pts[drag] = [Math.min(1, Math.max(0, p[0])), Math.min(1, Math.max(0, p[1]))]; draw();
});
c.addEventListener('pointerup', () => drag = -1);
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; c.width = im.naturalWidth; c.height = im.naturalHeight; c.hidden = false;
    document.getElementById('hint').hidden = true; draw(); };
  im.src = URL.createObjectURL(f);
});
document.getElementById('reset').onclick = () => { pts = [[0.2,0.2],[0.8,0.2],[0.8,0.8],[0.2,0.8]]; draw(); };
document.getElementById('inset').oninput = draw;
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(document.getElementById('json').textContent);
        document.getElementById('msg').textContent = 'Copied'; }
  catch { document.getElementById('msg').textContent = 'Select the text below and copy it'; }
};
out();
</script>
</body>
</html>
