# Optional: build and test on every push, publish images to GitHub Container
# Registry. Then use ghcr.io/<owner>/pop-gateway and ghcr.io/<owner>/pop-receiver
# as the image names in deploy/docker-compose.yml (and add the registry in Portainer).
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push gateway (runs the unit tests during the build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pop-gateway:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
      - name: Build and push receiver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/receiver.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pop-receiver:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
