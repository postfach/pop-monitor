# PoP Monitor for Docker Desktop (Windows or Mac). From this folder:
#   1. copy config.example.json to config.json and edit it
#   2. copy .env.example to .env and fill in the secrets
#   3. docker compose up -d --build
#   4. open http://localhost:8080
name: pop-monitor
services:
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: pop-monitor/gateway:0.1.0
    pull_policy: build        # always build locally; never look on Docker Hub
    restart: unless-stopped
    depends_on: [receiver]
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      POP_API_KEY: ${POP_API_KEY:?set POP_API_KEY in .env}
      POP_HMAC_KEY: ${POP_HMAC_KEY:-}
      POP_CAMERA_PASSWORD: ${POP_CAMERA_PASSWORD:?set POP_CAMERA_PASSWORD in .env}
      POP_TEAMS_WEBHOOK: ${POP_TEAMS_WEBHOOK:-}
    expose:
      - "8090"                  # live-settings API, reachable only by the receiver
    volumes:
      - ./config.json:/etc/pop-gateway/config.json:ro
      - ./recordings:/recordings
      - pop-queue:/var/lib/pop-gateway
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  receiver:
    build:
      context: ../..
      dockerfile: deploy/receiver.Dockerfile
    image: pop-monitor/receiver:0.1.0
    pull_policy: build
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      POP_TEAMS_WEBHOOK: ${POP_TEAMS_WEBHOOK:-}     # gateway-offline alerts come from here
      POP_SLACK_WEBHOOK: ${POP_SLACK_WEBHOOK:-}
      POP_API_KEY: ${POP_API_KEY:?set POP_API_KEY in .env}
      POP_HMAC_KEY: ${POP_HMAC_KEY:-}
      GATEWAY_URL: http://gateway:8090
      BOOKINGS_FILE: /bookings/vault-bookings.json
      CREATIVES_DIR: /creatives,/bookings/creatives   # artwork library: creatives-sync's, or a hand-made pull (newest wins)
      SYNC_URL: http://creatives-sync:8091
      POP_IMAGE_DAYS: ${POP_IMAGE_DAYS:-3}            # PoP photos kept this many days (the best go to SharePoint)
      POP_ALERT_IMAGE_DAYS: ${POP_ALERT_IMAGE_DAYS:-30}
      POP_RECORD_DAYS: ${POP_RECORD_DAYS:-90}         # details of every play (small)
      POP_DEFAULT_COORDS: ${POP_DEFAULT_COORDS:--36.85,174.76}   # sunrise/sunset for day vs night PoP photos
      POP_SITE_COORDS: ${POP_SITE_COORDS:-}     # optional per site: SITE_ID=lat,lon;SITE_ID=lat,lon
      REVIEW_USER: ${REVIEW_USER:-}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
    ports:
      - "${POP_REVIEW_PORT:-8080}:8080"
    volumes:
      - pop-received:/data
      - pop-creatives:/creatives:ro
      - ./bookings:/bookings:ro      # weekly Vault pull (vault-bookings.json) lands here

  creatives-sync:               # booked artwork from SharePoint for the Bookings page
    build:
      context: ../..
      dockerfile: sync/Dockerfile
    image: pop-monitor/creatives-sync:0.1.0
    pull_policy: build
    restart: unless-stopped
    depends_on: [receiver]
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      POP_API_KEY: ${POP_API_KEY:?set POP_API_KEY in .env}
      POP_TEAMS_WEBHOOK: ${POP_TEAMS_WEBHOOK:-}
      POP_SLACK_WEBHOOK: ${POP_SLACK_WEBHOOK:-}
      RECEIVER_URL: http://receiver:8080
      AZ_TENANT_ID: ${AZ_TENANT_ID:-}           # from deploy/sharepoint/setup-sharepoint-app.ps1
      AZ_CLIENT_ID: ${AZ_CLIENT_ID:-}
      AZ_CLIENT_SECRET: ${AZ_CLIENT_SECRET:-}
      AZ_SECRET_EXPIRES: ${AZ_SECRET_EXPIRES:-}   # warns 30 days before the secret runs out
      SP_SITE: ${SP_SITE:-lumodigital.sharepoint.com:/sites/LUMO}
      SP_LIBRARY: ${SP_LIBRARY:-Sales}
      SP_ROOT: ${SP_ROOT:-00_Sales (NEW FOLDER)/Booked Campaigns/Creative+MIs}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-240}
      SYNC_SCREENS: ${SYNC_SCREENS:-}           # blank = the Vault screens of the monitored sites
      # best day and night PoP photo per campaign into SharePoint (needs write access: docs/sharepoint-setup.md)
      DOOHLY_API_TOKEN: ${DOOHLY_API_TOKEN:-}   # bookings, slots and players from Doohly (read only): docs/doohly.md
      DOOHLY_DEVICES: ${DOOHLY_DEVICES:-}       # optional: SITE_ID=Doohly player name;... when the names differ
      POP_UPLOAD: ${POP_UPLOAD:-1}
      POP_ROOT: ${POP_ROOT:-00_Sales (NEW FOLDER)/Booked Campaigns/PoP Images}
      POP_DAY_AT: ${POP_DAY_AT:-20:00}          # today's daytime photos
      POP_NIGHT_AT: ${POP_NIGHT_AT:-08:00}      # last night's photos
    expose:
      - "8091"                  # status and "Sync now", reachable only by the receiver
    volumes:
      - pop-creatives:/creatives
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pop-queue:
  pop-received:
  pop-creatives:
